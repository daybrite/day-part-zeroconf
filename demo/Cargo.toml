[package]
name = "zeroconf-explorer"
version.workspace = true
edition = "2024"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/reference/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
xaml = ["day/xaml"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# Cargo defaults to rlib; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"

[dependencies]
day = { package = "day-app", git = "https://github.com/daybrite/day.git" }
day-piece-settings = { git = "https://github.com/daybrite/day.git" }
day-part-zeroconf = { path = ".." }
day-part-permissions = { git = "https://github.com/daybrite/day.git" }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }


[workspace]

[workspace.package]
version = "0.1.0"
