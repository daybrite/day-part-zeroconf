# Synthetic public TXT data advertised through the real native DNS-SD stack.
# Exercise long names/values and both axes of the inspector's data panels.
name: presentation
flow:
  - navigate: { route: publish }
  - input: { id: publish-name, text: "Day presentation fixture with a longer service name" }
  - input: { id: publish-type, text: "_dayzc._tcp" }
  - input:
      id: publish-txt
      text: |-
        path=/
        version=1
        model=Synthetic presentation fixture
        endpoint=[fddf:f4c0:e1d7:4983:187b:678a:87df:a6f3]:7000
        public-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        feature-a=enabled
        feature-b=enabled
        feature-c=enabled
        feature-d=enabled
        feature-e=enabled
        feature-f=enabled
        final-attribute=visible by scrolling
  - tap: { id: publish-start }
  - wait_for: { id: advertisement-active, timeout_secs: 30 }
  - navigate: { route: browse }
  - input: { id: browse-type, text: "_dayzc._tcp" }
  - input: { id: service-search, text: "Day presentation fixture" }
  - tap: { id: browse-start }
  - wait_for: { id: services-found, timeout_secs: 30 }
  - pause: 0.5
  - screenshot: browser-long-name
  - select: { id: service-list, index: 0 }
  - wait_for: { id: connection-ready, timeout_secs: 30 }
  - pause: 0.5
  - screenshot: inspector-long-name
  - scroll_to: { id: inspector-scroll, x: 0, y: 350 }
  - screenshot: txt-leading
  - scroll_to: { id: service-txt-horizontal, edge: trailing }
  - screenshot: txt-trailing
  - scroll_to: { id: service-txt-horizontal, edge: leading }
  - scroll_to: { id: service-txt-vertical, edge: bottom }
  - screenshot: txt-bottom
  - scroll_to: { id: tcp-connect }
  - tap: { id: tcp-connect }
  - wait_for: { id: connection-ok, timeout_secs: 15 }
  - nav_back: { only_on: [uikit, mdc, arkui] }
  - tap: { id: browse-stop }
  - navigate: { route: publish }
  - tap: { id: publish-stop }
  - assert_text: { id: publish-status, key: not_publishing }
