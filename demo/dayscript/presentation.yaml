# Synthetic public TXT data advertised through the real native DNS-SD stack.
# Exercise long names/values and both axes of the inspector's data panels.
name: presentation
flow:
  - navigate: { route: publish }
  - input: { id: publish_name, text: "Day presentation fixture with a longer service name" }
  - input: { id: publish_type, text: "_dayzc._tcp" }
  - input:
      id: publish_txt
      text: |-
        path=/
        version=1
        model=Synthetic presentation fixture
        endpoint=[fddf:f4c0:e1d7:4983:187b:678a:87df:a6f3]:7000
        public-key=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        feature-a=enabled
        feature-b=enabled
        feature-c=enabled
        feature-d=enabled
        feature-e=enabled
        feature-f=enabled
        final-attribute=visible by scrolling
  - tap: { id: publish_start }
  - wait_for: { id: advertisement_active, timeout_secs: 30 }
  - navigate: { route: browse }
  - input: { id: browse_type, text: "_dayzc._tcp" }
  - input: { id: service_search, text: "Day presentation fixture" }
  - tap: { id: browse_start }
  - wait_for: { id: services_found, timeout_secs: 30 }
  - pause: 0.5
  - screenshot: browser-long-name
  - select: { id: service_list, index: 0 }
  - wait_for: { id: connection_ready, timeout_secs: 30 }
  - pause: 0.5
  - screenshot: inspector-long-name
  - scroll_to: { id: inspector_scroll, x: 0, y: 350 }
  - screenshot: txt-leading
  - scroll_to: { id: service_txt_horizontal, edge: trailing }
  - screenshot: txt-trailing
  - scroll_to: { id: service_txt_horizontal, edge: leading }
  - scroll_to: { id: service_txt_vertical, edge: bottom }
  - screenshot: txt-bottom
  - scroll_to: { id: tcp_connect }
  - tap: { id: tcp_connect }
  - wait_for: { id: connection_ok, timeout_secs: 15 }
  - nav_back: { only_on: [uikit, material, arkui] }
  - tap: { id: browse_stop }
  - navigate: { route: publish }
  - tap: { id: publish_stop }
  - assert_text: { id: publish_status, key: not_publishing }
