# Native service-type enumeration, separate from the portable targeted workflow.
# Physical iOS requires Apple's multicast entitlement; do not silently test a preset list.
name: enumeration
flow:
  - navigate: { route: publish }
  - input: { id: publish_name, text: "Day enumeration fixture" }
  - tap: { id: publish_start }
  - wait_for: { id: advertisement_active, timeout_secs: 30 }
  - navigate: { route: browse }
  - input: { id: browse_type, text: "" }
  - input: { id: service_search, text: "Day enumeration fixture" }
  - tap: { id: browse_start }
  - wait_for: { id: services_found, timeout_secs: 30 }
  - screenshot: enumeration
  - tap: { id: browse_stop }
  - navigate: { route: publish }
  - tap: { id: publish_stop }
