[package]
name = "day-part-zeroconf"
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
description = "Native DNS-SD discovery and advertisement for Day apps"
repository = "https://github.com/daybrite/day-part-zeroconf"
license = "MPL-2.0"

[package.metadata.day]
compat = "0.*"

# Lint policy: Clippy's `pedantic` group is on, and CI treats every warning as an error
# (`-D warnings`). The table matches the one in `day`.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Day converts between float layout units and the integer pixel, index and FFI types of eight
# native toolkits. `as` is the only operator for float-to-integer, and these four lints cannot
# tell that from a narrowing integer cast, so they would need an exception at nearly every site.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Function length and short or similar names are style limits this codebase does not follow:
# geometry is written in `x`/`y`/`w`/`h`, and a backend's realize and patch arms stay in one place.
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
# A backend module imports the whole spec vocabulary, and which names it uses differs with the
# backend feature and target, so an explicit list is unused or incomplete under some of them.
wildcard_imports = "allow"
# Option structs and backend calls mirror native toolkit flags, which are booleans.
fn_params_excessive_bools = "allow"
struct_excessive_bools = "allow"
# Asks for `#[must_use]` on nearly every function that returns a value, including ones called
# for their effect. Builders are still covered by `return_self_not_must_use`.
must_use_candidate = "allow"

[target.'cfg(any(target_os = "android", target_env = "ohos"))'.dependencies]
day-bridge = "0.*"

[target.'cfg(target_os = "android")'.dependencies]
day-platform-android = "0.*"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"

[target.'cfg(all(target_os = "linux", not(target_env = "ohos")))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_Dns", "Win32_Foundation", "Win32_System_SystemInformation"] }

[build-dependencies]
day-build = "0.*"

[package.metadata.day.android]
permissions = ["android.permission.INTERNET", "android.permission.ACCESS_NETWORK_STATE", "android.permission.CHANGE_WIFI_MULTICAST_STATE"]

# Day's Harmony host already declares ohos.permission.INTERNET, the mDNS API's
# sole permission. Repeating it in a part creates a duplicate manifest entry.

[package.metadata.day.flatpak]
finish-args = ["--system-talk-name=org.freedesktop.Avahi"]

[workspace]
